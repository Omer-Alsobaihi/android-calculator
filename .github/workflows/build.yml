name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        id: sdk
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: "platform-tools;platforms;android-34;build-tools;34.0.0"

      - name: Check SDK
        run: |
          echo "ANDROID_HOME: ${{ steps.sdk.outputs.android-home }}"
          ls -la ${{ steps.sdk.outputs.android-home }}/platforms/ 2>/dev/null || echo "No platforms"
          ls -la ${{ steps.sdk.outputs.android-home }}/build-tools/ 2>/dev/null || echo "No build-tools"

      - name: Download Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle

      - name: Generate Gradle wrapper
        run: |
          cd $GITHUB_WORKSPACE
          gradle wrapper --gradle-version 8.5 --no-daemon

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.android-home }}
        run: |
          cd $GITHUB_WORKSPACE
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
