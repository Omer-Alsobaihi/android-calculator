name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/robohawk/android-sdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build debug APK
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
