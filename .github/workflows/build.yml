name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          apt-get update && apt-get install -y wget unzip
          export ANDROID_HOME=${HOME}/android-sdk
          mkdir -p ${ANDROID_HOME}
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d ${ANDROID_HOME}/cmdline-tools
          mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
          export PATH=${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}
          export ANDROID_HOME=${ANDROID_HOME}
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" --sdk_root=${ANDROID_HOME} --verbose

      - name: Setup Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ steps.install-sdk.outputs.android-sdk-path }}
        run: |
          cd $GITHUB_WORKSPACE
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
