name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (no cache)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          cache: 'false'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=${{ github.workspace }}/android-sdk
          mkdir -p ${ANDROID_HOME}
          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mkdir -p ${ANDROID_HOME}/cmdline-tools
          mv cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
          export PATH=${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" --sdk_root=${ANDROID_HOME}
          sdkmanager "platforms;android-34" --sdk_root=${ANDROID_HOME}
          sdkmanager "build-tools;34.0.0" --sdk_root=${ANDROID_HOME}
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "SDK_DIR=${ANDROID_HOME}" >> $GITHUB_ENV
          # Create local.properties for Gradle
          echo "sdk.dir=${ANDROID_HOME}" > ${GITHUB_WORKSPACE}/local.properties
          echo "Created local.properties: $(cat ${GITHUB_WORKSPACE}/local.properties)"

      - name: Setup Gradle wrapper
        run: |
          cd $GITHUB_WORKSPACE
          gradle wrapper --gradle-version 8.5 --no-daemon 2>&1
          echo "Wrapper created"
          ls -la gradle/wrapper/

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.SDK_DIR }}
        run: |
          cd $GITHUB_WORKSPACE
          echo "=== Environment ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "PATH: $PATH"
          echo "=== local.properties ==="
          cat local.properties 2>/dev/null || echo "No local.properties"
          echo "=== Building ==="
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== Build complete ==="
          echo "Exit code: $?"
          echo "=== Output files ==="
          find . -name "*.apk" -type f -exec ls -la {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log
          retention-days: 5
